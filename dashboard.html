<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BookClub — Dashboard</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./Images/BookClub.png" />
    <script type="module" defer src="./js/dashboard.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="min-h-screen bg-slate-50">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <aside class="w-full md:w-72 bg-white border-r p-4">
            <div class="mb-6 flex flex-col items-center text-center">
                <img src="./Images/BookClub.png" alt="BookClub" class="w-16 h-16 object-cover rounded mb-2" />
                <div>
                    <h2 class="text-xl font-semibold text-indigo-600">BookClub</h2>
                    <p class="text-sm text-slate-500">Gerencie autores e livros</p>
                </div>
            </div>
            <nav class="space-y-2">
                <button id="btnAuthors"
                    class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 flex items-center gap-3">
                    <img src="./Images/Authors.png" alt="" class="w-5 h-5 object-contain" aria-hidden="true" />
                    <span>Autores</span>
                </button>

                <button id="btnBooks"
                    class="w-full text-left px-3 py-2 rounded hover:bg-slate-100 flex items-center gap-3">
                    <img src="./Images/Books.png" alt="" class="w-5 h-5 object-contain" aria-hidden="true" />
                    <span>Livros</span>
                </button>

                <button id="btnLogout"
                    class="w-full text-left px-3 py-2 mt-4 text-rose-600 hover:bg-slate-100 flex items-center gap-3">
                    <span>Sair</span>
                </button>
            </nav>
        </aside>

        <!-- Main -->
        <main class="flex-1 p-6">
            <!-- Authors view -->
            <section id="viewAuthors" class="space-y-6">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold">Autores</h3>
                    <button id="openAuthorForm" class="bg-indigo-600 text-white px-3 py-1 rounded">Novo autor</button>
                </div>

                <div id="authorFormWrapper" class="hidden bg-white p-4 rounded shadow">
                    <form id="authorForm" class="space-y-3">
                        <input id="authorId" type="hidden" />
                        <div>
                            <label class="text-sm text-slate-600">Nome</label>
                            <input id="authorName" required class="w-full px-3 py-2 border rounded" />
                        </div>
                        <div>
                            <label class="text-sm text-slate-600">Biografia</label>
                            <textarea id="authorBio" rows="3" class="w-full px-3 py-2 border rounded"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="text-sm text-slate-600">País</label>
                                <input id="authorCountry" class="w-full px-3 py-2 border rounded" />
                            </div>
                            <div>
                                <label class="text-sm text-slate-600">Nascimento</label>
                                <input id="authorBirthdate" type="date" class="w-full px-3 py-2 border rounded" />
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Salvar</button>
                            <button type="button" id="cancelAuthor" class="px-4 py-2 border rounded">Cancelar</button>
                        </div>
                    </form>
                </div>

                <div id="authorsList" class="grid gap-3"></div>
            </section>

            <hr class="my-6" />

            <!-- Books view -->
            <section id="viewBooks" class="space-y-6 hidden">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold">Livros</h3>
                    <button id="openBookForm" class="bg-indigo-600 text-white px-3 py-1 rounded">Novo livro</button>
                </div>

                <div id="bookFormWrapper" class="hidden bg-white p-4 rounded shadow">
                    <form id="bookForm" class="space-y-3">
                        <input id="bookId" type="hidden" />
                        <div>
                            <label class="text-sm text-slate-600">Título</label>
                            <input id="bookTitle" required class="w-full px-3 py-2 border rounded" />
                        </div>
                        <div>
                            <label class="text-sm text-slate-600">Resumo</label>
                            <textarea id="bookSummary" rows="3" class="w-full px-3 py-2 border rounded"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="text-sm text-slate-600">Gênero</label>
                                <input id="bookGenre" class="w-full px-3 py-2 border rounded" />
                            </div>
                            <div>
                                <label class="text-sm text-slate-600">Ano</label>
                                <input id="bookYear" type="number" min="0" step="1" inputmode="numeric"
                                    class="w-full px-3 py-2 border rounded" />
                            </div>
                            <div>
                                <label class="text-sm text-slate-600">Autor</label>
                                <select id="bookAuthor" class="w-full px-3 py-2 border rounded"></select>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Salvar</button>
                            <button type="button" id="cancelBook" class="px-4 py-2 border rounded">Cancelar</button>
                        </div>
                    </form>
                </div>

                <div id="booksList" class="grid gap-3"></div>
            </section>

            <div id="msg" class="fixed bottom-6 right-6 p-3 bg-indigo-600 text-white rounded hidden"></div>
        </main>
    </div>
</body>

</html>
